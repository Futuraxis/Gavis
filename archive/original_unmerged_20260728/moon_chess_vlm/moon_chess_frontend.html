<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>月亮棋 Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 32px auto;
    }

    .title {
      margin-bottom: 8px;
      text-align: center;
      font-size: 32px;
      font-weight: 700;
    }

    .subtitle {
      margin-bottom: 28px;
      text-align: center;
      color: #6b7280;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 260px;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    .info-item {
      margin-bottom: 16px;
    }

    .info-label {
      margin-bottom: 5px;
      color: #6b7280;
      font-size: 13px;
    }

    .info-value {
      font-weight: 600;
    }

    .status-running {
      color: #15803d;
    }

    .status-finished {
      color: #b91c1c;
    }

    .board-panel {
      text-align: center;
    }

    .board {
      width: min(560px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 4px solid #111827;
      background: white;
    }

    .cell {
      position: relative;
      border: 1px solid #111827;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cell:hover {
      background: #f8fafc;
    }

    .cell.disabled {
      cursor: default;
    }

    .piece {
      width: 58%;
      height: 58%;
      position: relative;
      pointer-events: none;
    }

    .piece.x::before,
    .piece.x::after {
      content: "";
      position: absolute;
      top: 47%;
      left: 0;
      width: 100%;
      height: 10%;
      border-radius: 999px;
      background: #2563eb;
      transform-origin: center;
    }

    .piece.x::before {
      transform: rotate(45deg);
    }

    .piece.x::after {
      transform: rotate(-45deg);
    }

    .piece.o {
      border: 10px solid #dc2626;
      border-radius: 50%;
    }

    .order-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #111827;
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .turn-text {
      margin: 18px 0 14px;
      font-size: 18px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .capture-status {
      min-height: 20px;
      margin-top: 12px;
      color: #475569;
      font-size: 13px;
    }

    .result-box {
      margin-top: 20px;
      text-align: left;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 520px;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f9fafb;
      font-size: 14px;
      line-height: 1.5;
    }

    .history-item.removed {
      background: #fff7ed;
      border-color: #fdba74;
    }

    .json-box {
      margin-top: 20px;
      text-align: left;
    }

    .json-box textarea {
      width: 100%;
      min-height: 220px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #0f172a;
      color: #e2e8f0;
    }

    .tip {
      margin-top: 16px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .board {
        width: min(520px, 100%);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">月亮棋 Demo</h1>
    <div class="subtitle">固定布局，方便 Binding Layer 对棋盘和棋子进行视觉识别</div>

    <section class="layout">
      <aside class="panel">
        <h2>游戏信息</h2>

        <div class="info-item">
          <div class="info-label">对局 ID</div>
          <div class="info-value" id="gameId">moon_demo_001</div>
        </div>

        <div class="info-item">
          <div class="info-label">当前玩家</div>
          <div class="info-value" id="currentPlayer">X</div>
        </div>

        <div class="info-item">
          <div class="info-label">当前步数</div>
          <div class="info-value" id="stepCount">0</div>
        </div>

        <div class="info-item">
          <div class="info-label">状态</div>
          <div class="info-value status-running" id="status">进行中</div>
        </div>

        <div class="info-item">
          <div class="info-label">获胜者</div>
          <div class="info-value" id="winner">-</div>
        </div>

        <div class="tip">
          每位玩家最多保留 3 枚棋子。下第 4 枚时，自己最早落下的棋子会自动消失。
        </div>
      </aside>

      <section class="panel board-panel">
        <div class="board" id="board"></div>

        <div class="turn-text" id="turnText">轮到 X 行动</div>

        <div class="controls">
          <button class="secondary" id="undoBtn">撤销一步</button>
          <button class="primary" id="resetBtn">重新开始</button>
          <button class="primary" id="captureBtn">导出并识别</button>
          <button class="danger" id="endBtn">结束游戏</button>
        </div>

        <div class="capture-status" id="captureStatus">点击“导出并识别”后，选择当前页面所在标签页即可截图并发送到本地识别接口</div>

        <div class="json-box">
          <h2>当前状态 JSON</h2>
          <textarea id="stateJson" readonly></textarea>
        </div>

        <div class="result-box">
          <h2>视觉识别结果</h2>
          <textarea id="recognitionJson" readonly placeholder="点击按钮后，这里会显示 Qwen 返回的 Observation"></textarea>
        </div>
      </section>

      <aside class="panel">
        <h2>落子历史</h2>
        <div class="history" id="history"></div>
      </aside>
    </section>
  </main>

  <script>
    const game = {
      gameId: "moon_demo_001",
      board: Array(9).fill(null),
      currentPlayer: "X",
      stepCount: 0,
      status: "running",
      winner: null,
      history: [],
      pieceOrder: {
        X: [],
        O: []
      },
      snapshots: []
    };

    const boardEl = document.getElementById("board");
    const currentPlayerEl = document.getElementById("currentPlayer");
    const stepCountEl = document.getElementById("stepCount");
    const statusEl = document.getElementById("status");
    const winnerEl = document.getElementById("winner");
    const turnTextEl = document.getElementById("turnText");
    const historyEl = document.getElementById("history");
    const stateJsonEl = document.getElementById("stateJson");
    const recognitionJsonEl = document.getElementById("recognitionJson");
    const captureStatusEl = document.getElementById("captureStatus");
    const pageEl = document.querySelector(".page");
    const RECOGNITION_API_URL = "http://127.0.0.1:8765/api/recognize";

    function cellId(index) {
      const row = Math.floor(index / 3);
      const col = index % 3;
      return `cell_${row}_${col}`;
    }

    function createBoard() {
      boardEl.innerHTML = "";

      for (let index = 0; index < 9; index++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = String(index);
        cell.dataset.cellId = cellId(index);
        cell.setAttribute("aria-label", cellId(index));
        cell.addEventListener("click", () => handleMove(index));
        boardEl.appendChild(cell);
      }
    }

    function saveSnapshot() {
      game.snapshots.push(JSON.stringify({
        board: game.board,
        currentPlayer: game.currentPlayer,
        stepCount: game.stepCount,
        status: game.status,
        winner: game.winner,
        history: game.history,
        pieceOrder: game.pieceOrder
      }));
    }

    function restoreSnapshot(snapshot) {
      const data = JSON.parse(snapshot);
      game.board = data.board;
      game.currentPlayer = data.currentPlayer;
      game.stepCount = data.stepCount;
      game.status = data.status;
      game.winner = data.winner;
      game.history = data.history;
      game.pieceOrder = data.pieceOrder;
    }

    function handleMove(index) {
      if (game.status !== "running") return;
      if (game.board[index] !== null) return;

      saveSnapshot();

      const player = game.currentPlayer;
      let removed = null;

      if (game.pieceOrder[player].length >= 3) {
        const oldestIndex = game.pieceOrder[player].shift();
        game.board[oldestIndex] = null;
        removed = oldestIndex;
      }

      game.board[index] = player;
      game.pieceOrder[player].push(index);
      game.stepCount += 1;

      game.history.push({
        seq: game.stepCount,
        player,
        placedIndex: index,
        placedCellId: cellId(index),
        removedIndex: removed,
        removedCellId: removed === null ? null : cellId(removed)
      });

      const winner = checkWinner();

      if (winner) {
        game.status = "finished";
        game.winner = winner;
      } else {
        game.currentPlayer = player === "X" ? "O" : "X";
      }

      render();
    }

    function checkWinner() {
      const lines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];

      for (const [a, b, c] of lines) {
        const value = game.board[a];
        if (value && value === game.board[b] && value === game.board[c]) {
          return value;
        }
      }

      return null;
    }

    function getPieceAge(player, index) {
      const position = game.pieceOrder[player].indexOf(index);
      return position === -1 ? null : position + 1;
    }

    function exportState() {
      const legalActions = game.board
        .map((value, index) => value === null ? cellId(index) : null)
        .filter(Boolean);

      return {
        gameId: game.gameId,
        gameType: "moon_tic_tac_toe",
        seq: game.stepCount,
        currentPlayerId: game.currentPlayer === "X" ? "player_x" : "player_o",
        board: [
          game.board.slice(0, 3),
          game.board.slice(3, 6),
          game.board.slice(6, 9)
        ],
        pieceOrder: {
          player_x: game.pieceOrder.X.map((index, order) => ({
            cellId: cellId(index),
            placedOrder: order + 1
          })),
          player_o: game.pieceOrder.O.map((index, order) => ({
            cellId: cellId(index),
            placedOrder: order + 1
          }))
        },
        legalActions,
        stepCount: game.stepCount,
        status: game.status,
        winnerId:
          game.winner === "X"
            ? "player_x"
            : game.winner === "O"
              ? "player_o"
              : null
      };
    }

    function renderBoard() {
      const cells = boardEl.querySelectorAll(".cell");

      cells.forEach((cell, index) => {
        cell.innerHTML = "";
        cell.classList.toggle("disabled", game.status !== "running");

        const value = game.board[index];

        if (!value) return;

        const piece = document.createElement("div");
        piece.className = `piece ${value.toLowerCase()}`;
        piece.dataset.piece = value;
        piece.dataset.cellId = cellId(index);

        const badge = document.createElement("div");
        badge.className = "order-badge";
        badge.textContent = String(getPieceAge(value, index));

        cell.appendChild(piece);
        cell.appendChild(badge);
      });
    }

    function renderHistory() {
      historyEl.innerHTML = "";

      if (game.history.length === 0) {
        historyEl.textContent = "暂无落子记录";
        return;
      }

      game.history.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";

        let text = `${item.seq}. ${item.player} 落在 ${item.placedCellId}`;

        if (item.removedCellId) {
          div.classList.add("removed");
          text += `，并移除 ${item.removedCellId}`;
        }

        div.textContent = text;
        historyEl.appendChild(div);
      });
    }

    function render() {
      renderBoard();
      renderHistory();

      currentPlayerEl.textContent = game.currentPlayer;
      stepCountEl.textContent = String(game.stepCount);
      statusEl.textContent = game.status === "running" ? "进行中" : "已结束";
      statusEl.className =
        "info-value " +
        (game.status === "running" ? "status-running" : "status-finished");

      winnerEl.textContent = game.winner || "-";

      turnTextEl.textContent =
        game.status === "running"
          ? `轮到 ${game.currentPlayer} 行动`
          : game.winner
            ? `${game.winner} 获胜`
            : "游戏已结束";

      stateJsonEl.value = JSON.stringify(exportState(), null, 2);
    }

    function setCaptureStatus(message, isError = false) {
      captureStatusEl.textContent = message;
      captureStatusEl.style.color = isError ? "#b91c1c" : "#475569";
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function renderPageToPngBlob() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        throw new Error("当前浏览器不支持屏幕捕获，请改用较新的 Chrome 或 Edge。");
      }

      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: {
          displaySurface: "browser"
        },
        audio: false,
        preferCurrentTab: true,
        selfBrowserSurface: "include",
        surfaceSwitching: "include"
      });

      try {
        const [track] = stream.getVideoTracks();
        if (!track) {
          throw new Error("未获取到可用的视频轨道");
        }

        const video = document.createElement("video");
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;

        await video.play();
        await new Promise(resolve => {
          if (video.readyState >= 2) {
            resolve();
            return;
          }
          video.onloadedmetadata = () => resolve();
        });

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext("2d");

        if (!context) {
          throw new Error("浏览器无法创建截图画布");
        }

        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        return await new Promise((resolve, reject) => {
          canvas.toBlob(blob => {
            if (!blob) {
              reject(new Error("PNG 导出失败"));
              return;
            }
            resolve(blob);
          }, "image/png");
        });
      } finally {
        stream.getTracks().forEach(track => track.stop());
      }
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("图片读取失败"));
        reader.readAsDataURL(blob);
      });
    }

    async function exportScreenshot() {
      setCaptureStatus("正在生成截图...");
      recognitionJsonEl.value = "";

      try {
        const pngBlob = await renderPageToPngBlob();
        const fileName = `moon-chess-screenshot-${Date.now()}.png`;
        downloadBlob(pngBlob, fileName);

        setCaptureStatus("截图已生成，正在发送到本地识别接口...");
        const imageDataUrl = await blobToDataUrl(pngBlob);
        const response = await fetch(RECOGNITION_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            gameId: game.gameId,
            frameSeq: game.stepCount,
            imageDataUrl
          })
        });

        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.error || "识别接口返回失败");
        }

        recognitionJsonEl.value = JSON.stringify(result.observation, null, 2);
        setCaptureStatus(`截图已下载并完成识别：${fileName}`);
      } catch (error) {
        setCaptureStatus(`截图或识别失败：${error.message}`, true);
      }
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      game.board = Array(9).fill(null);
      game.currentPlayer = "X";
      game.stepCount = 0;
      game.status = "running";
      game.winner = null;
      game.history = [];
      game.pieceOrder = { X: [], O: [] };
      game.snapshots = [];
      render();
    });

    document.getElementById("undoBtn").addEventListener("click", () => {
      const snapshot = game.snapshots.pop();
      if (!snapshot) return;
      restoreSnapshot(snapshot);
      render();
    });

    document.getElementById("endBtn").addEventListener("click", () => {
      if (game.status !== "running") return;
      saveSnapshot();
      game.status = "finished";
      game.winner = null;
      render();
    });

    document.getElementById("captureBtn").addEventListener("click", () => {
      exportScreenshot();
    });

    createBoard();
    render();
  </script>
</body>
</html>
