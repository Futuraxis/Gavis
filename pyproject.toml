[project]
name = "gavis"
version = "0.2.0"
description = "自适应策略游戏 AI Agent — 四层架构 (Translator / Engine / Solver / Interface)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
binding = [
    "opencv-python>=4.8",
    "pydantic>=2.0",
    "httpx>=0.25",
]
torch = [
    "torch>=2.0",
]
psro = [
    "scipy>=1.10",
    "gymnasium>=0.28",
    "tqdm>=4.64",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
all = [
    "opencv-python>=4.8",
    "pydantic>=2.0",
    "httpx>=0.25",
    "torch>=2.0",
    "scipy>=1.10",
    "gymnasium>=0.28",
    "tqdm>=4.64",
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.urls]
homepage = "https://github.com/Quan-huayan/Gavis"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "archive/",
    "_gen_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "layer1_translator*",
    "layer2_engine*",
    "layer3_solvers*",
    "layer4_interface*",
    "demos*",
]
